name: Review public knowledge freshness
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run knowledge:build
      - run: npm run knowledge:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knowledge-freshness-review
          path: eval/results/knowledge-freshness.json
          if-no-files-found: warn
